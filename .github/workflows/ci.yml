name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Testcontainers utilise le Docker préinstallé sur les runners Ubuntu.
      - name: Build et tests
        run: ./mvnw -B verify

      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build de l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: expenseflow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
