spring:
  application:
    name: expenseflow

  datasource:
    url: jdbc:postgresql://localhost:5433/expenseflow
    username: expenseflow
    password: expenseflow

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

expenseflow:
  jwt:
    # Valeur de développement uniquement : surchargée par la variable JWT_SECRET en production.
    secret: ${JWT_SECRET:F1tgZxsf9r/GaRrWrpbViUv5UrwjX/6cOpbakIaACwQ=}
    ttl: 24h
  receipts:
    directory: ${RECEIPTS_DIR:./data/receipts}
    max-size: 5MB

logging:
  level:
    org.hibernate.SQL: debug