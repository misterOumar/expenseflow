spring:
  application:
    name: expenseflow

  datasource:
    url: jdbc:postgresql://localhost:5433/expenseflow
    username: expenseflow
    password: expenseflow

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.SQL: debug